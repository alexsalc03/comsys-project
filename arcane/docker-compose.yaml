services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:v2
    container_name: arcane

    ports:
      - "127.0.0.1:3552:3552"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../data/arcane:/app/data

    environment:
      - APP_URL=http://localhost:3552
      - PUID=1000
      - PGID=1000
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - TZ=Europe/Zurich

    cgroup: host

    healthcheck:
      test: ["CMD", "./arcane", "health", "--timeout", "2s"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    restart: unless-stopped
    stop_grace_period: 15s
